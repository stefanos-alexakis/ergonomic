name: pesquisa

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pesquisa-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      RESPONDENTE_COOKIE_SECRET: ${RESPONDENTE_COOKIE_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      # src/lib/upload.ts grava em public/uploads/, não em /app/uploads —
      # o volume tinha que estar montado no caminho de verdade, senão os
      # logotipos enviados nunca sobreviveriam a um `docker compose up
      # --build` (achado em produção: escrita falhava com EACCES antes
      # disso ser notado, porque o caminho errado nem tinha permissão).
      - pesquisa_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pesquisanet
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_traefik-public"
      # HTTPS — nomes exclusivos desta app (review.md §6.2): nunca reusar
      # "crm-alex"/"https-redirect" do outro app na mesma VPS.
      - "traefik.http.routers.pesquisa.rule=Host(`pesquisa.agtrade.com.br`)"
      - "traefik.http.routers.pesquisa.entrypoints=websecure"
      - "traefik.http.routers.pesquisa.tls.certresolver=letsencrypt"
      - "traefik.http.services.pesquisa.loadbalancer.server.port=3000"
      - "traefik.http.routers.pesquisa-http.rule=Host(`pesquisa.agtrade.com.br`)"
      - "traefik.http.routers.pesquisa-http.entrypoints=web"
      - "traefik.http.routers.pesquisa-http.middlewares=pesquisa-https-redirect"
      - "traefik.http.middlewares.pesquisa-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.pesquisa-https-redirect.redirectscheme.permanent=true"

  db:
    image: postgres:16-alpine
    container_name: pesquisa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Sem "ports:" de propósito — o banco só é alcançável pela rede
    # interna, nunca pela internet (review.md §6.6).
    volumes:
      - pesquisa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pesquisanet

volumes:
  pesquisa_pgdata:
  pesquisa_uploads:

networks:
  pesquisanet:
    driver: bridge
  traefik-public:
    external: true
    name: traefik_traefik-public
