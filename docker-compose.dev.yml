services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pesquisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pesquisa}
      POSTGRES_DB: ${POSTGRES_DB:-pesquisa}
    ports:
      - "5432:5432"
    volumes:
      - pesquisa_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pesquisa} -d ${POSTGRES_DB:-pesquisa}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pesquisa_dev_pgdata:
